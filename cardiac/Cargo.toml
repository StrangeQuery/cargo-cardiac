[package]
name = "cardiac"
version = "0.1.1"
edition = "2021"
# the [lints] table
rust-version = "1.74"
description = "Rust language package for cargo-cardiac. Install that, not this."
license = "MIT"
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["cardiac", "compiler", "retrocomputing", "education"]
categories = ["compilers", "emulators"]

[lints.rust]
# set by the CARDIAC compiler when it builds this crate; never by cargo
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(cardiac)"] }
